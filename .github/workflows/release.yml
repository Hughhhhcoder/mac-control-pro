name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build universal download
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: VERSION="${RELEASE_TAG#v}" ./scripts/build-release.sh
      - name: Publish packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.dmg dist/*.sha256 \
            --title "Mac Control Pro $RELEASE_TAG" \
            --notes-file docs/RELEASE_NOTES.md \
            --verify-tag
