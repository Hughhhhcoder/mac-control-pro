name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Package universal application
        run: ./scripts/build-release.sh
      - name: Upload development packages
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Control-Pro-development
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
